---
- name: Require the deliberately narrow H0 platform
  ansible.builtin.assert:
    that:
      - kin_target_distribution == 'Ubuntu'
      - kin_node_id is match('^[0-9a-f]{32}$')
      - ansible_version.full == '2.20.9'
      - kin_source_commit is match('^[0-9a-f]{40}$')
    fail_msg: H0 requires Ubuntu, Ansible 2.20.9, an exact Git commit and a stable node ID.
    quiet: true

- name: Require a clean host or accepted M0 migration evidence
  ansible.builtin.include_role:
    name: kin_m0
    tasks_from: verify

- name: Inspect H0 directory targets before managing them
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ kin_config_dir }}"
    - "{{ kin_state_dir }}"
    - "{{ kin_receipts_dir }}"
  register: kin_h0_target_directory_stats
  loop_control:
    label: "{{ item }}"

- name: Refuse symlinked or non-directory H0 containers
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or item.stat.isdir
    fail_msg: "H0 refuses unsafe directory target: {{ item.item }}"
    quiet: true
  loop: "{{ kin_h0_target_directory_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install the H0 base packages
  ansible.builtin.apt:
    name: "{{ kin_h0_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
  when: kin_h0_manage_packages | bool

- name: Create the H0 directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ kin_config_dir }}"
    - "{{ kin_state_dir }}"
    - "{{ kin_receipts_dir }}"

- name: Inspect an existing config-level record
  ansible.builtin.stat:
    path: "{{ kin_state_file }}"
    follow: false
  register: kin_h0_existing_state_file

- name: Require an existing config-level record to be a regular file
  ansible.builtin.assert:
    that:
      - not (kin_h0_existing_state_file.stat.islnk | default(false))
      - not kin_h0_existing_state_file.stat.exists or kin_h0_existing_state_file.stat.isreg
    fail_msg: Existing Kin config-level state is not a regular file.
    quiet: true

- name: Read an existing config-level record
  ansible.builtin.slurp:
    src: "{{ kin_state_file }}"
  register: kin_h0_existing_state_raw
  when: kin_h0_existing_state_file.stat.exists

- name: Decode an existing config-level record
  ansible.builtin.set_fact:
    kin_h0_existing_state: >-
      {{ kin_h0_existing_state_raw.content | b64decode | from_json }}
  when: kin_h0_existing_state_file.stat.exists

- name: Refuse an incompatible existing config level
  ansible.builtin.assert:
    that:
      - kin_h0_existing_state.schema == 'kin-config-level-state/v1'
      - kin_h0_existing_state.config_level in ['H0', 'H1']
      - kin_h0_existing_state.source_commit is match('^[0-9a-f]{40}$')
      - kin_h0_existing_state.node_id == kin_node_id
    fail_msg: Existing Kin state belongs to another schema, level or machine.
    quiet: true
  when: kin_h0_existing_state_file.stat.exists

- name: Preserve the prior source receipt before an upgrade
  ansible.builtin.copy:
    dest: >-
      {{ kin_receipts_dir }}/{{ kin_h0_existing_state.source_commit }}-{{ kin_h0_existing_state.config_level }}.json
    owner: root
    group: root
    mode: "0644"
    force: false
    content: |
      {{ kin_h0_existing_state | to_nice_json }}
  when:
    - kin_h0_existing_state_file.stat.exists
    - kin_h0_existing_state.source_commit != kin_source_commit

- name: Select the honest H0 boundary for this source
  ansible.builtin.set_fact:
    kin_h0_target_level: >-
      {{ kin_h0_existing_state.config_level
         if (kin_h0_existing_state_file.stat.exists and
             kin_h0_existing_state.source_commit == kin_source_commit)
         else 'H0' }}

- name: Inspect H0 managed file targets before writing them
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ kin_status_command }}"
    - "{{ kin_h0_receipt_file }}"
  register: kin_h0_managed_file_stats
  loop_control:
    label: "{{ item }}"

- name: Refuse symlinked or non-file H0 targets
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or item.stat.isreg
    fail_msg: "H0 refuses unsafe managed file target: {{ item.item }}"
    quiet: true
  loop: "{{ kin_h0_managed_file_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Remove a prior-source H1 status capability until H1 is reapplied
  ansible.builtin.file:
    path: "{{ kin_status_command }}"
    state: absent
  when: kin_h0_target_level == 'H0'

- name: Record the H0 boundary for this exact source
  ansible.builtin.copy:
    dest: "{{ kin_state_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ {
        'schema': 'kin-config-level-state/v1',
        'config_level': kin_h0_target_level,
        'node_id': kin_node_id,
        'source_commit': kin_source_commit
      } | to_nice_json }}

- name: Record immutable H0 source acceptance evidence
  ansible.builtin.copy:
    dest: "{{ kin_h0_receipt_file }}"
    owner: root
    group: root
    mode: "0644"
    force: false
    content: |
      {{ {
        'schema': 'kin-config-level-receipt/v1',
        'config_level': 'H0',
        'node_id': kin_node_id,
        'source_commit': kin_source_commit
      } | to_nice_json }}
